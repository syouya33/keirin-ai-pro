<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競輪AI PRO V11</title><style>body{background:#101827;color:#fff;font-family:-apple-system,sans-serif;margin:0;padding:18px}h1{font-size:25px}button,select{font-size:17px;padding:13px;border-radius:9px;border:0;margin:5px 0}button{background:#1d85ff;color:white}select{width:100%;background:#fff}.card{background:#202c41;border-radius:12px;padding:14px;margin:12px 0}.muted{color:#b6c4d9}table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid #46516a;text-align:left}#error{color:#ffba9c;white-space:pre-wrap}</style></head><body><h1>🚴 競輪AI PRO V11</h1><div class="card"><div id="status">出走表を確認中…</div><div id="updated" class="muted"></div><button onclick="load()">出走表を更新</button></div><div class="card"><label>開催日</label><select id="date" onchange="fillVenues()"></select><label>開催場</label><select id="venue" onchange="fillRaces()"></select><label>レース</label><select id="race" onchange="render()"></select></div><div id="content" class="card">出走表の取得待ち</div><div id="error"></div><script>let all=[];const el=id=>document.getElementById(id);function opt(id,values){el(id).replaceChildren(...values.map(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;return o}))}function unique(a){return [...new Set(a.filter(Boolean))]}function fillDates(){opt('date',unique(all.map(x=>x.date)).sort());fillVenues()}function fillVenues(){let d=el('date').value;opt('venue',unique(all.filter(x=>x.date===d).map(x=>x.venue)).sort());fillRaces()}function fillRaces(){let d=el('date').value,v=el('venue').value;opt('race',unique(all.filter(x=>x.date===d&&x.venue===v).map(x=>String(x.race_no))).sort((a,b)=>parseInt(a)-parseInt(b)));render()}function render(){let x=all.find(x=>x.date===el('date').value&&x.venue===el('venue').value&&String(x.race_no)===el('race').value);let c=el('content');c.replaceChildren();if(!x){c.textContent='表示できる出走表がありません';return}let h=document.createElement('h2');h.textContent=`${x.venue} ${x.race_no}R`;c.append(h);let t=document.createElement('table'),head=document.createElement('tr');['車番','選手','競走得点','脚質','ライン'].forEach(s=>{let th=document.createElement('th');th.textContent=s;head.append(th)});t.append(head);(x.players||[]).forEach(p=>{let tr=document.createElement('tr');[p.number,p.name,p.score,p.style,p.line].forEach(s=>{let td=document.createElement('td');td.textContent=s??'';tr.append(td)});t.append(tr)});c.append(t)}async function load(){el('status').textContent='最新データを確認中…';el('error').textContent='';try{let r=await fetch('./keirin_data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();all=Array.isArray(j.races)?j.races.filter(x=>x.date&&x.venue&&x.race_no&&Array.isArray(x.players)&&x.players.length):[];el('updated').textContent='データ更新: '+(j.updated_at||'不明');if(!all.length){el('status').textContent='出走表 0件（取得元のデータが未取得）';el('content').textContent='取得元の更新状況を確認してください。架空の選手情報は表示しません。';el('error').textContent=j.status||j.errors?.join('\n')||'';return}el('status').textContent=`取得済み ${all.length}レース`;fillDates()}catch(e){el('status').textContent='出走表を読み込めません';el('error').textContent=String(e)}}load();setInterval(load,300000)</script></body></html>
