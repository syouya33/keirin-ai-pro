name: 競輪AI 自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: プログラムを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 競輪AIを実行
        run: python keirin_auto.py

      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keirin_data.json
          if ! git diff --cached --quiet; then
            git commit -m "競輪AIデータ自動更新"
            git push
          fi
