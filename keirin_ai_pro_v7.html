<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競輪AI PRO v7</title><style>body{margin:0;background:#0b1222;color:#f1f5ff;font-family:-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{color:#7de3f5;font-size:29px}section{background:#1c2941;border-radius:16px;padding:16px;margin:16px 0}label{display:block;margin:12px 0 5px}input,select{box-sizing:border-box;width:100%;padding:12px;border:0;border-radius:9px;font-size:16px}button{background:#65b6d1;color:#071323;border:0;border-radius:9px;padding:13px;font-size:16px;font-weight:bold;margin:8px 5px 4px 0}.secondary{background:#dce5f5}.muted{color:#b9c5d8;font-size:14px}.status{background:#113c35;color:#a8ffe0;border-radius:10px;padding:12px;margin-top:10px;font-weight:bold}.card{background:#293952;border-radius:12px;padding:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{line-height:1.8}.warning{color:#ffd18b}</style></head><body><main><h1>🚴 競輪AI PRO v7</h1><p>iPhone対応・動作確認版</p><section><strong>レース設定</strong><label for="venue">開催場</label><select id="venue"></select><label for="race">レース</label><select id="race"></select><label for="count">車立て</label><select id="count"><option value="7">7車</option><option value="9">9車</option></select><button type="button" id="make">入力欄を作成</button><div id="status" class="status" role="status" aria-live="polite">準備中</div><p class="muted">出走表の自動取得は未実装です。選手情報は手入力してください。</p></section><section><strong>選手データ</strong><p class="muted">得点＝競走得点。ラインは同じ連携の選手に同じ番号。着順は「1,3,2」のように入力。</p><div id="rows"></div><button type="button" id="analyze">予想を計算</button><button type="button" class="secondary" id="save">入力を保存</button><button type="button" class="secondary" id="load">保存を読込</button></section><section><strong>予想結果</strong><div id="output" class="result">選手データを入力して「予想を計算」を押してください。</div><p class="muted warning">参考スコアであり、検証済みの的中確率ではありません。的中や利益は保証されません。</p></section></main><script>
(function(){'use strict';var $=function(id){return document.getElementById(id)};var venues='函館 青森 いわき平 弥彦 前橋 取手 宇都宮 大宮 西武園 京王閣 立川 松戸 千葉 川崎 平塚 小田原 伊東 静岡 名古屋 岐阜 大垣 豊橋 富山 松阪 四日市 福井 奈良 向日町 和歌山 岸和田 玉野 広島 防府 高松 小松島 高知 松山 小倉 久留米 武雄 佐世保 別府 熊本'.split(' ');venues.forEach(function(s){$('venue').add(new Option(s,s))});for(var j=1;j<=12;j++)$('race').add(new Option(j+'R',j));var version=0;function field(label,cls,value,type){var wrap=document.createElement('div');var l=document.createElement('label');l.textContent=label;var inp=document.createElement('input');inp.className=cls;inp.type=type||'text';inp.value=value;wrap.appendChild(l);wrap.appendChild(inp);return wrap}function make(){var n=Number($('count').value);$('rows').replaceChildren();for(var i=1;i<=n;i++){var card=document.createElement('div');card.className='card';var heading=document.createElement('strong');heading.textContent=i+'番車';card.appendChild(heading);card.appendChild(field('選手名','name','','text'));var grid=document.createElement('div');grid.className='grid';grid.appendChild(field('競走得点','score','100','number'));grid.appendChild(field('ライン番号','line',String(i),'number'));card.appendChild(grid);card.appendChild(field('直近着順（任意）','form','','text'));$('rows').appendChild(card)}version++;$('status').textContent='✅ '+n+'車分の入力欄を作成しました（操作 '+version+'回目）'}function data(){return Array.from($('rows').children).map(function(card,i){return {number:i+1,name:card.querySelector('.name').value.trim()||(i+1)+'番車',score:Number(card.querySelector('.score').value),line:card.querySelector('.line').value,form:card.querySelector('.form').value}})}function analyze(){var a=data();if(a.some(function(x){return !Number.isFinite(x.score)||x.score<=0})){$('output').textContent='競走得点を正しく入力してください。';return}var groups={};a.forEach(function(x){groups[x.line]=(groups[x.line]||0)+1});a.forEach(function(x){var p=x.form.split(/[,，\s]+/).map(Number).filter(function(n){return n>=1&&n<=9});var bonus=p.length?(5-p.reduce(function(s,n){return s+n},0)/p.length)*0.9:0;x.power=x.score+bonus+Math.min(groups[x.line]-1,2)*0.6});var max=Math.max.apply(null,a.map(function(x){return x.power}));var weights=a.map(function(x){return Math.exp((x.power-max)/5)});var total=weights.reduce(function(s,n){return s+n},0);a.forEach(function(x,i){x.weight=weights[i]/total});a.sort(function(x,y){return y.weight-x.weight});var out=$('output');out.replaceChildren();var title=document.createElement('strong');title.textContent=$('venue').value+' '+$('race').value+'R｜簡易スコア順位';out.appendChild(title);a.forEach(function(x,i){var p=document.createElement('div');p.textContent=(i+1)+'位：'+x.number+'番 '+x.name+'（参考比率 '+(x.weight*100).toFixed(1)+'%）';out.appendChild(p)});var note=document.createElement('p');note.textContent='参考の並び：'+a.slice(0,3).map(function(x){return x.number}).join(' → ')+'（3連単の的中確率ではありません）';out.appendChild(note);out.scrollIntoView({behavior:'smooth',block:'center'})}$('make').addEventListener('click',make);$('analyze').addEventListener('click',analyze);$('save').addEventListener('click',function(){try{localStorage.setItem('keirin-v7',JSON.stringify({venue:$('venue').value,race:$('race').value,count:$('count').value,data:data()}));$('status').textContent='✅ 入力データを保存しました'}catch(e){$('status').textContent='保存できませんでした'}});$('load').addEventListener('click',function(){try{var s=JSON.parse(localStorage.getItem('keirin-v7'));if(!s){$('status').textContent='保存データがありません';return}$('venue').value=s.venue;$('race').value=s.race;$('count').value=s.count;make();Array.from($('rows').children).forEach(function(card,i){var x=s.data[i];if(!x)return;card.querySelector('.name').value=x.name;card.querySelector('.score').value=x.score;card.querySelector('.line').value=x.line;card.querySelector('.form').value=x.form});$('status').textContent='✅ 保存データを読み込みました'}catch(e){$('status').textContent='読み込みに失敗しました'}});make()})();
</script></body></html>
