<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競輪AI PRO v8</title><style>body{margin:0;background:#0b1222;color:#f1f5ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:780px;margin:auto;padding:20px}h1{color:#8bdff3;font-size:29px}section{background:#1e2b43;border-radius:18px;padding:18px;margin:17px 0}label{display:block;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;font-size:17px;padding:11px;border:0;border-radius:9px;background:#fff;color:#101828}textarea{min-height:145px}button{background:#67bbd7;color:#08192b;border:0;border-radius:10px;padding:13px 17px;font-size:17px;font-weight:700;margin:9px 6px 4px 0}button.secondary{background:#d4e0ed}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{padding:13px;background:#2a3b57;border-radius:12px;margin:10px 0}.player h3{margin:0 0 7px}.msg{background:#104c38;border-radius:10px;padding:13px;margin:10px 0}.error{background:#74333b}.muted{color:#bdc9da;font-size:14px;line-height:1.6}.score{background:#263b59;border-radius:10px;padding:12px;margin:8px 0}a{color:#9de6ff}</style></head><body><main><h1>🚴 競輪AI PRO v8</h1><p>iPhone対応・出走表取り込みテスト版</p><section><h2>レース設定</h2><label>開催場</label><select id="venue"></select><div class="row"><div><label>レース</label><select id="race"></select></div><div><label>車立て</label><select id="count"><option value="7">7車</option><option value="9">9車</option></select></div></div><button id="make">入力欄を作成</button><div id="status" class="muted" aria-live="polite"></div></section><section><h2>出走表データ取り込み</h2><p class="muted">出走表をコピーして貼り付ける方式。まずは「車番,選手名,競走得点,ライン」の順に1選手1行で入力。カンマ区切り・タブ区切りに対応。例：1,山田太郎,105.2,1-3-5</p><textarea id="paste" placeholder="1,選手A,105.2,1-3-5&#10;2,選手B,102.1,2-4&#10;3,選手C,101.4,1-3-5"></textarea><button id="import">貼り付けデータを反映</button><button class="secondary" id="clear">貼り付け欄を消去</button><p class="muted">※公式サイトからの直接自動取得は未実装。利用許諾とデータ形式を確認してから接続します。</p></section><section><h2>選手データ</h2><p class="muted">競走得点を入力。ラインは「1-3-5」のように入力（任意）。</p><div id="players"></div><button id="predict">分析する</button><div id="results"></div></section><section><h2>保存</h2><button id="save">この端末に保存</button><button class="secondary" id="restore">保存データを復元</button><div id="saved" class="muted"></div></section><p class="muted">予想は競走得点を主に使う簡易ランキングであり、学習済みAIや的中保証ではありません。実際の投票前に公式情報を確認してください。</p></main><script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const venues='函館 青森 いわき平 弥彦 前橋 取手 宇都宮 大宮 西武園 京王閣 立川 松戸 千葉 川崎 平塚 小田原 伊東 静岡 名古屋 岐阜 大垣 豊橋 富山 松阪 四日市 福井 奈良 向日町 和歌山 岸和田 玉野 広島 防府 高松 小松島 高知 松山 小倉 久留米 武雄 佐世保 別府 熊本'.split(' ');
venues.forEach(v=>{const o=document.createElement('option');o.textContent=v;$('venue').appendChild(o)});
for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'R';$('race').appendChild(o)}
function msg(t,bad=false){$('status').textContent=t;$('status').style.color=bad?'#ffb5b5':'#8ff0b9'}
function make(){const n=Number($('count').value),box=$('players');box.replaceChildren();for(let i=1;i<=n;i++){const div=document.createElement('div');div.className='player';const h=document.createElement('h3');h.textContent=i+'番車';div.appendChild(h);[['name','選手名','text'],['score','競走得点','number'],['line','ライン（任意）','text']].forEach(([key,ph,type])=>{const l=document.createElement('label');l.textContent=ph;const inp=document.createElement('input');inp.type=type;inp.placeholder=ph;inp.dataset.key=key;inp.dataset.num=i;if(type==='number')inp.step='0.01';div.append(l,inp)});box.appendChild(div)}msg(n+'車分の入力欄を作成しました')}
function field(n,key){return $('players').querySelector('[data-num="'+n+'"][data-key="'+key+'"]')}
function parseLine(line){const cells=line.split(/\t|,|，/).map(s=>s.trim());if(cells.length<3)return null;const num=Number(cells[0].replace(/[^0-9]/g,''));if(!Number.isInteger(num)||num<1||num>9||!cells[1])return null;const score=Number(cells[2]);if(!Number.isFinite(score)||score<0||score>150)return null;return {num,name:cells[1],score,line:cells.slice(3).join(',')}}
$('make').addEventListener('click',make);
$('import').addEventListener('click',()=>{const lines=$('paste').value.split(/\r?\n/).filter(x=>x.trim());const rows=lines.map(parseLine).filter(Boolean);if(!rows.length){msg('取り込める行がありません。例：1,選手A,105.2,1-3-5',true);return}const max=Math.max(...rows.map(x=>x.num));$('count').value=max>7?'9':'7';make();rows.forEach(x=>{field(x.num,'name').value=x.name;field(x.num,'score').value=x.score;field(x.num,'line').value=x.line});msg(rows.length+'人分のデータを取り込みました。内容を確認してください')});
$('clear').addEventListener('click',()=>{$('paste').value='';msg('貼り付け欄を消去しました')});
$('predict').addEventListener('click',()=>{const n=Number($('count').value),rows=[];for(let i=1;i<=n;i++){const name=field(i,'name').value.trim(),raw=field(i,'score').value,score=Number(raw);if(name&&raw!==''&&Number.isFinite(score))rows.push({num:i,name,score,line:field(i,'line').value.trim()})}const out=$('results');out.replaceChildren();if(rows.length<2){const p=document.createElement('p');p.textContent='選手名と競走得点を2人以上入力してください';out.appendChild(p);return}rows.sort((a,b)=>b.score-a.score);const h=document.createElement('h3');h.textContent='簡易分析（競走得点順）';out.appendChild(h);rows.forEach((r,i)=>{const d=document.createElement('div');d.className='score';d.textContent=(i+1)+'位：'+r.num+'番 '+r.name+' ／ '+r.score.toFixed(2)+'点'+(r.line?' ／ '+r.line:'');out.appendChild(d)});const p=document.createElement('p');p.className='muted';p.textContent='競走得点以外の展開・直近成績・ライン強度は未反映。買い目や勝率ではありません。';out.appendChild(p)});
$('save').addEventListener('click',()=>{const data={venue:$('venue').value,race:$('race').value,count:$('count').value,players:[]};for(let i=1;i<=Number(data.count);i++)data.players.push({name:field(i,'name').value,score:field(i,'score').value,line:field(i,'line').value});try{localStorage.setItem('keirin_v8',JSON.stringify(data));$('saved').textContent='保存しました'}catch(e){$('saved').textContent='保存できませんでした：'+e.message}});
$('restore').addEventListener('click',()=>{try{const d=JSON.parse(localStorage.getItem('keirin_v8')||'null');if(!d){$('saved').textContent='保存データがありません';return}$('venue').value=d.venue;$('race').value=d.race;$('count').value=d.count;make();(d.players||[]).forEach((p,i)=>{if(field(i+1,'name')){field(i+1,'name').value=p.name||'';field(i+1,'score').value=p.score||'';field(i+1,'line').value=p.line||''}});$('saved').textContent='復元しました'}catch(e){$('saved').textContent='復元できませんでした'}});
make();
})();
</script></body></html>
