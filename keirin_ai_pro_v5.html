<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競輪AI PRO v5</title><style>body{font-family:-apple-system,sans-serif;background:#0b1220;color:#eef3ff;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{color:#67e8f9}section{background:#19243a;padding:16px;border-radius:14px;margin:14px 0}input,select,button{font-size:16px;padding:10px;border-radius:8px;border:0;margin:4px 0}input{width:85px;background:#fff}button{background:#06b6d4;color:#07121c;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #34445c;text-align:left}small{color:#b9c5d9}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.result{font-size:19px;line-height:1.8}a{color:#67e8f9}</style></head><body><main><h1>🚴 競輪AI PRO <small>v5</small></h1><p>iPhone対応・オフライン試作版。選手データを入力すると着順確率と組み合わせを試算します。</p><section><div class="row"><label>開催場 <input id="venue" placeholder="立川"></label><label>レース <input id="race" type="number" min="1" max="12" value="1"></label></div><label>車立て <select id="count"><option value="7">7車</option><option value="9">9車</option></select></label><button onclick="build()">入力欄を作成</button><p><small>競走得点は各選手の直近の得点を入力。ライン番号は同じラインに同じ数字を設定してください。</small></p><div id="entries"></div></section><section><button onclick="analyze()">予想を計算</button> <button onclick="save()">入力を保存</button><div id="output"></div></section><section><b>データ参照</b><p><a href="https://www.keirin.jp/pc/top" target="_blank">KEIRIN.JP（公式）</a></p><small>出走表・オッズは自動取得していません。実データを入力して使う検証用の確率モデルです。的中や利益は保証しません。実際の投票は行いません。</small></section></main><script>const $=id=>document.getElementById(id);function build(){let n=+$('count').value;let s='<table><tr><th>車</th><th>選手名</th><th>競走得点</th><th>ライン</th></tr>';for(let i=1;i<=n;i++)s+=`<tr><td>${i}</td><td><input id="name${i}" style="width:95px" placeholder="選手${i}"></td><td><input id="score${i}" type="number" step="0.01" value="100"></td><td><input id="line${i}" type="number" min="1" max="9" value="${i}"></td></tr>`; $('entries').innerHTML=s+'</table>'}function get(){return Array.from({length:+$('count').value},(_,j)=>{let i=j+1;return {id:i,name:$('name'+i).value||'車番'+i,score:Number($('score'+i).value),line:$('line'+i).value}})}function analyze(){let a=get();if(a.some(x=>!Number.isFinite(x.score)||x.score<=0)){alert('競走得点を確認してください');return}let sizes={};a.forEach(x=>sizes[x.line]=(sizes[x.line]||0)+1);let weights=a.map(x=>Math.exp(Math.max(-12,Math.min(12,(x.score-100)/7+0.09*(sizes[x.line]-1)))));let orders=[];for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++)if(i!==j)for(let k=0;k<a.length;k++)if(k!==i&&k!==j){let sum=weights.reduce((p,c)=>p+c,0);let p=weights[i]/sum*weights[j]/(sum-weights[i])*weights[k]/(sum-weights[i]-weights[j]);orders.push({key:`${a[i].id}-${a[j].id}-${a[k].id}`,p})}orders.sort((x,y)=>y.p-x.p);let sum=weights.reduce((p,c)=>p+c,0);let ranks=a.map((x,i)=>({name:x.name,id:x.id,p:weights[i]/sum})).sort((x,y)=>y.p-x.p);$('output').innerHTML=`<h3>${$('venue').value||'開催場未入力'} ${$('race').value}R</h3><p>1着推定確率（モデル値）</p><table>${ranks.map(x=>`<tr><td>${x.id} ${x.name}</td><td>${(x.p*100).toFixed(1)}%</td></tr>`).join('')}</table><h3>3連単 上位10通り</h3><table>${orders.slice(0,10).map(x=>`<tr><td>${x.key}</td><td>${(x.p*100).toFixed(2)}%</td></tr>`).join('')}</table><p><small>計算方法：競走得点とライン人数から強度を作り、Plackett–Luceモデルで着順確率を算出。実績検証・確率校正は未実施です。表示値は信頼できる的中確率とは限りません。</small></p>`}function save(){localStorage.setItem('keirinV5',JSON.stringify({venue:$('venue').value,race:$('race').value,count:$('count').value,entries:get()}));alert('この端末のブラウザに保存しました')}build();try{let d=JSON.parse(localStorage.getItem('keirinV5'));if(d){$('venue').value=d.venue;$('race').value=d.race;$('count').value=d.count;build();d.entries.forEach(x=>{$('name'+x.id).value=x.name;$('score'+x.id).value=x.score;$('line'+x.id).value=x.line})}}catch(e){}</script></body></html>
