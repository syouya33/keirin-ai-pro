<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競輪AI PRO V10</title><style>body{margin:0;background:#0b1324;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px 16px;background:#142747}h1{margin:0;font-size:25px}main{padding:16px;max-width:750px;margin:auto}.box{background:#17263d;border:1px solid #354762;border-radius:13px;padding:15px;margin-bottom:15px}button,a.btn{background:#237bdf;color:white;border:0;border-radius:9px;padding:12px 15px;font-size:16px;text-decoration:none;display:inline-block;margin:5px 4px 5px 0}select,input{font-size:16px;padding:9px;border-radius:7px;max-width:100%;box-sizing:border-box}input{width:100%;margin:5px 0;background:#fff;color:#111}small,.muted{color:#b8c7dc}.error{color:#ffbd89}.ok{color:#9fe2bd}.row{padding:12px 0;border-top:1px solid #344762}.grid{display:grid;grid-template-columns:65px 1fr 90px;gap:7px;align-items:center}.grid input{margin:2px 0}.rank{font-size:20px;font-weight:bold}a{color:#8fc4ff}</style></head><body><header><h1>🚴 競輪AI PRO <small>V10</small></h1><div class="muted">出走表データ表示・手入力予想</div></header><main><section class="box"><h2>出走表の自動読み込み</h2><div id="status">読み込み中…</div><p><button id="reload">データを再読み込み</button><a class="btn" href="https://www.winticket.jp/keirin/racecard/" target="_blank" rel="noopener">公式掲載の出走表を確認</a></p><div id="races"></div></section><section class="box"><h2>選手データを入力して予想</h2><p class="muted">自動取得ができない場合も使用できます。競走得点が高い順の簡易ランキングです。的中を保証するものではありません。</p><label>車立て <select id="count"><option value="7">7車</option><option value="9">9車</option></select></label><button id="make">入力欄を作成</button><div id="entries"></div><button id="predict">得点順で分析</button><div id="result"></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function make(){let html='<div class="grid"><small>車番</small><small>選手名</small><small>競走得点</small></div>';for(let i=1;i<=Number($('count').value);i++)html+=`<div class="grid"><strong>${i}番</strong><input id="name${i}" placeholder="選手名"><input id="score${i}" type="number" inputmode="decimal" step="0.01" placeholder="得点"></div>`;$('entries').innerHTML=html;$('result').textContent='';}
function predict(){let list=[];for(let i=1;i<=Number($('count').value);i++){let n=$('name'+i).value.trim(),s=$('score'+i).value;if(n&&s!==''&&Number.isFinite(Number(s)))list.push({i,n,s:Number(s)});}if(list.length<2){$('result').textContent='選手名と競走得点を2人以上入力してください。';return;}list.sort((a,b)=>b.s-a.s);$('result').innerHTML='<h3>簡易ランキング（競走得点順）</h3>'+list.map((x,j)=>`<div class="row"><span class="rank">${j+1}位：${x.i}番 ${esc(x.n)}</span> ／ ${x.s.toFixed(2)}点</div>`).join('')+'<p class="muted">※ライン・脚質・直近成績・展開は未反映。これはAIによる総合予測ではありません。</p>';}
async function load(){let status=$('status'),box=$('races');status.textContent='GitHubのデータを確認中…';box.innerHTML='';try{let res=await fetch('./keirin_data.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let d=await res.json();let races=Array.isArray(d.races)?d.races:[];let valid=races.filter(r=>Array.isArray(r.players)&&r.players.some(p=>p&&p.name));status.innerHTML=`<span class="${valid.length?'ok':'error'}">選手情報を含む出走表：${valid.length}件 ／ レース候補：${races.length}件</span><br><small>更新：${esc(d.updated_at||'不明')} ／ 状態：${esc(d.status||'未設定')}</small>`;if(!races.length){box.innerHTML='<p class="error">出走表データがまだありません。取得プログラムの実行・取得元の確認が必要です。</p>';return;}box.innerHTML=races.slice(0,100).map(r=>{let ps=Array.isArray(r.players)?r.players:[];let url=typeof r.racecard_url==='string'&&/^https:\/\//.test(r.racecard_url)?r.racecard_url:null;return `<div class="row"><strong>${esc(r.venue||r.label||'開催場未設定')} ${esc(r.race_no||'?')}R</strong> <small>${esc(r.date||'')}</small><div class="muted">選手データ ${ps.length}件</div>${ps.map(p=>`<div>${esc(p.number||'')}番 ${esc(p.name||'')} ${esc(p.score||'')}</div>`).join('')}${url?`<a href="${esc(url)}" target="_blank" rel="noopener">出走表ページを開く ↗</a>`:''}</div>`}).join('');}catch(e){status.innerHTML='<span class="error">出走表を読み込めません：'+esc(e.message)+'</span>';box.innerHTML='<p class="muted">同じGitHub Pages内の keirin_data.json を参照します。まだ公開されていない場合は読み込めません。</p>';}}
$('make').addEventListener('click',make);$('predict').addEventListener('click',predict);$('reload').addEventListener('click',load);$('count').addEventListener('change',make);make();load();
</script></body></html>
